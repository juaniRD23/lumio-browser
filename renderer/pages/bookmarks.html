<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="pages.css" />
  <link rel="stylesheet" href="lists.css" />
  <link rel="stylesheet" href="bookmarks.css" />
</head>
<body>
  <div class="bmm">
    <header class="bmm-top">
      <h1>Bookmarks</h1>
      <span class="grow"></span>
      <input id="search" class="field" type="search" placeholder="Search bookmarks" spellcheck="false" aria-label="Search bookmarks" />
      <button class="btn small" id="new-folder">New folder</button>
      <button class="iconbtn" id="more" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" title="More actions"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="5.5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="18.5" r="1.7" fill="currentColor"/></svg></button>
    </header>
    <div class="bmm-body">
      <nav class="bmm-side" aria-label="Folders">
        <div id="tree" class="bmm-tree" role="tree" aria-label="Folders"></div>
      </nav>
      <main class="bmm-main">
        <div class="bmm-bar">
          <div id="crumbs" class="bmm-crumbs" aria-live="polite"></div>
          <div id="selbar" class="bmm-selbar" hidden>
            <span id="selcount"></span>
            <button class="btn small ghost" data-sel="open">Open all</button>
            <button class="btn small ghost danger" data-sel="delete">Delete</button>
            <button class="btn small ghost" data-sel="clear">Clear</button>
          </div>
        </div>
        <div id="list" class="bmm-list" role="listbox" aria-multiselectable="true" aria-label="Bookmarks"></div>
      </main>
    </div>
  </div>
  <div id="menu" class="bmm-menu" role="menu" hidden></div>
  <div id="toast" class="bmm-toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button class="btn small" id="toast-undo">Undo</button></div>
  <script type="module" src="bookmarks.js"></script>
</body>
</html>
