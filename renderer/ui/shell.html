<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lumio Browser</title>
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="tabstrip.css" />
  <link rel="stylesheet" href="omnibox.css" />
  <link rel="stylesheet" href="bookmarks-bar.css" />
  <link rel="stylesheet" href="tab-groups.css" />
  <link rel="stylesheet" href="side-panel.css" />
  <link rel="stylesheet" href="permission-chip.css" />
  <link rel="stylesheet" href="capture-bar.css" />
  <link rel="stylesheet" href="translate.css" />
  <link rel="stylesheet" href="reading-mode.css" />
  <link rel="stylesheet" href="page-tools.css" />
  <link rel="stylesheet" href="extensions-bar.css" />
  <link rel="stylesheet" href="vertical-tabs.css" />
  <link rel="stylesheet" href="split-view.css" />
</head>
<body class="no-anim">
  <aside id="sidebar" aria-label="Sidebar"></aside>
  <header id="tabstrip">
    <div class="traffic-space"></div>
    <button id="sb-open" class="icon-btn small" title="Show sidebar (⌘⇧S)" aria-label="Show sidebar"></button>
    <div id="tabs" role="tablist"></div>
    <button id="newtab" class="icon-btn" title="New Tab (⌘T)" aria-label="New Tab"></button>
    <div class="strip-drag"></div>
    <div id="incognito-badge" hidden title="Incognito: pages you visit here aren't saved to history"><span class="ic"></span><span>Incognito</span></div>
    <button id="tab-search-btn" class="icon-btn small" title="Search tabs (⌘⇧A)" aria-label="Search tabs" aria-haspopup="dialog"></button>
  </header>

  <nav id="toolbar">
    <button id="back" class="icon-btn" title="Back (⌘[)" aria-label="Back"></button>
    <button id="forward" class="icon-btn" title="Forward (⌘])" aria-label="Forward"></button>
    <button id="reload" class="icon-btn" title="Reload (⌘R)" aria-label="Reload"></button>
    <div id="omnibox">
      <button id="site-icon" aria-label="View site information"></button>
      <button id="perm-chip" aria-label="Site permissions" class="perm-chip" aria-haspopup="dialog" aria-expanded="false" hidden></button>
      <span id="perm-live" class="sr-only" aria-live="polite"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or type a URL" aria-label="Address and search bar" />
      <span id="toast" hidden></span>
      <button id="zoom-badge" hidden title="Reset zoom"></button>
      <button id="pw-key" class="icon-btn small" title="Save password" aria-label="Save password" hidden></button>
      <button id="popups-btn" class="popups-btn" hidden></button>
      <button id="star" class="icon-btn small" title="Bookmark this page (⌘D)" aria-label="Bookmark"></button>
    </div>
    <div id="findbar" hidden>
      <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" />
      <span id="find-count"></span>
      <button class="icon-btn small" id="find-prev" title="Previous (⇧⌘G)"></button>
      <button class="icon-btn small" id="find-next" title="Next (⌘G)"></button>
      <button class="icon-btn small" id="find-close" title="Close (Esc)"></button>
    </div>
    <div id="ext-area" hidden>
      <div id="ext-actions" role="group" aria-label="Pinned extensions"></div>
      <button id="ext-btn" class="icon-btn" title="Extensions" aria-label="Extensions"></button>
    </div>
    <button id="downloads" class="icon-btn" title="Downloads" aria-label="Downloads" hidden><span class="ring"></span></button>
    <button id="side-btn" class="icon-btn" title="Side panel: reading list, bookmarks, history" aria-label="Side panel" aria-pressed="false"></button>
    <button id="ai-toggle" class="ai-toggle" title="Lumio AI (⌘⇧L)" aria-label="Toggle Lumio AI">
      <span class="mark"></span><span>Lumio</span>
    <span id="beta-badge" title="Lumio Beta: new versions arrive here first, for testing" hidden>Beta</span>
        </button>
    <button id="update-btn" class="update-btn" hidden><span class="ic"></span><span class="label">Update</span><span class="bar"></span></button>
    <button id="account-btn" class="account-btn" title="Lumio account" aria-label="Lumio account"></button>
    <button id="menu-btn" class="icon-btn" title="Customize and control Lumio" aria-label="Menu" aria-haspopup="menu" aria-expanded="false"></button>
  </nav>

  <div id="bookmarks-bar" hidden role="toolbar" aria-label="Bookmarks"></div>

  <main id="workspace">
    <section id="pagecol">
      <div id="infobars" aria-live="polite"></div>
      <div id="capture-bar" role="status" hidden></div>
      <div id="slot"></div>
    </section>
    <div id="resizer" title="Drag to resize"></div>
    <aside id="panel" aria-label="Lumio AI">
      <div id="side-switch" role="tablist" aria-label="Side panel"></div>
      <section id="side-view" hidden></section>
      <div id="panel-head">
        <span class="mark big" id="panel-mark"></span>
        <span class="panel-title">Lumio</span>
        <span class="spacer"></span>
        <button id="expand-btn" class="icon-btn small" title="Full-size chat" aria-label="Full-size chat" aria-pressed="false"></button>
        <button id="chats-btn" class="icon-btn small" title="Chats"></button>
        <button id="newchat-btn" class="icon-btn small" title="New chat"></button>
        <button id="panel-close" class="icon-btn small" title="Hide (⌘⇧L)"></button>
      </div>
      <div id="chat-menu" class="popover" hidden><div id="chat-list"></div></div>
      <div id="messages" role="region" aria-label="Chat" tabindex="-1"></div>
      <section id="plan" aria-label="Task progress" hidden>
        <button id="plan-head" type="button" aria-expanded="true" aria-controls="plan-list">
          <span class="plan-ic"></span><span class="plan-title">Task progress</span>
          <span id="plan-now" class="plan-now"></span>
          <span id="plan-count" class="plan-count"></span><i class="chev"></i>
        </button>
        <ol id="plan-list"></ol>
      </section>
      <div id="composer">
        <div id="reasoning-menu" class="popover cmp-menu effort-menu" role="menu" aria-label="Effort" hidden>
          <div class="list-label">Effort</div>
          <div id="effort-rows"></div>
        </div>
        <div id="plus-menu" class="popover cmp-menu plus-menu" role="menu" aria-label="Add" hidden>
          <button type="button" class="menu-row" id="add-files" role="menuitem">
            <span class="mi"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></span>
            <span class="mt"><b>Add photos &amp; files</b><small>Pictures, PDFs, Word, PowerPoint, Excel, text · up to 10</small></span>
          </button>
          <button type="button" class="menu-row" id="add-tabs" role="menuitem">
            <span class="mi"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/></svg></span>
            <span class="mt"><b>Ask about my tabs</b><small>Lumio reads every open tab with your message</small></span>
          </button>
          <div class="list-label conn-label">Connections</div>
          <div id="apps" class="apps"></div>
        </div>
        <div id="mode-menu" class="popover cmp-menu mode-menu" role="menu" aria-label="Approvals" hidden>
          <div class="list-label">Approvals</div>
          <button type="button" class="menu-row" role="menuitemradio" data-mode="ask"><span class="mi"></span><span class="mt"><b>Ask</b><small>Asks before every action. Reading pages never asks.</small></span><i class="tick"></i></button>
          <button type="button" class="menu-row" role="menuitemradio" data-mode="auto"><span class="mi"></span><span class="mt"><b translate="no">Auto</b><small>Browses on its own. Still checks with you before buying or sending anything.</small></span><i class="tick"></i></button>
          <button type="button" class="menu-row bypass" role="menuitemradio" data-mode="bypass"><span class="mi"></span><span class="mt"><b>Bypass</b><small>Never asks. Use with care.</small></span><i class="tick"></i></button>
        </div>
        <div id="bypass-confirm" class="popover cmp-menu bypass-confirm" role="alertdialog" aria-modal="false" aria-labelledby="bypass-title" aria-describedby="bypass-text" hidden>
          <div class="bc-title" id="bypass-title">Turn on Bypass?</div>
          <p class="bc-text" id="bypass-text">Lumio will act in your tabs without asking you first, even to buy or send something. Use it only where you can undo a mistake.</p>
          <div class="bc-actions"><button type="button" class="btn" data-bc="cancel">Cancel</button><button type="button" class="btn danger-fill" data-bc="ok">Turn on Bypass</button></div>
        </div>
        <div id="usage-pop" class="popover cmp-menu usage-pop" role="dialog" aria-label="Usage" hidden></div>
        <div id="voice-bar" class="voice-bar" hidden>
          <button type="button" class="vb-orb" title="Skip what Lumio is saying, or finish talking" aria-label="Skip, or finish talking"><i></i></button>
          <div class="vb-main">
            <div class="vb-status" aria-live="polite">Listening…</div>
            <div class="vb-cap"></div>
          </div>
          <button type="button" class="vb-mute round-btn" title="Mute the microphone" aria-label="Mute the microphone" aria-pressed="false"></button>
          <button type="button" class="vb-end">End</button>
        </div>
        <div id="wf-menu" class="popover cmp-menu plus-menu wf-menu" role="listbox" aria-label="Workflows" hidden></div>
        <div id="wf-card" class="wf-card" hidden></div>
        <div id="tray" class="tray" hidden></div>
        <button id="page-suggest" class="page-suggest" type="button" hidden></button>
        <div id="context-chip" class="chip" hidden title="Lumio will read this page with your message"><i></i><span></span><button aria-label="Don't include this page">×</button></div>
        <textarea id="prompt" rows="1" placeholder="Ask Lumio, or tell it what to do…" spellcheck="true"></textarea>
        <div class="composer-row" role="toolbar" aria-label="Message options">
          <button id="plus-btn" class="round-btn" title="Add files and connections" aria-label="Add files and connections" aria-haspopup="menu" aria-expanded="false"></button>
          <button id="reasoning-btn" class="model-btn is-effort" type="button" aria-label="Effort" aria-haspopup="menu" aria-expanded="false"><span id="reasoning-bars" class="ic"></span><span id="reasoning-name" class="lbl">Medium</span><svg class="chip-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <button id="mode-btn" class="model-btn is-mode" type="button" aria-label="Approval mode" aria-haspopup="menu" aria-expanded="false"><span id="mode-ic" class="ic"></span><span id="mode-name" class="lbl">Ask</span><svg class="chip-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <button id="project-btn" class="model-btn is-folder is-empty" type="button" aria-label="Project" aria-haspopup="menu" aria-expanded="false" hidden><span class="pi ic"></span><span class="pn lbl">No project</span><svg class="chip-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <span class="spacer"></span>
          <button id="usage-btn" class="round-btn quiet usage-btn" type="button" aria-label="Usage" aria-haspopup="dialog" aria-expanded="false" data-level="low" hidden></button>
          <button id="mic-btn" class="round-btn quiet mic-btn" type="button" aria-label="Dictate" data-tip="Dictate"></button>
          <button id="voice-btn" class="round-btn voice-btn" title="Voice mode: talk with Lumio hands-free" aria-label="Voice mode" aria-pressed="false"></button>
          <button id="send" class="send" title="Send (↵)" aria-label="Send"></button>
        </div>
        <div id="project-menu" class="popover cmp-menu plus-menu project-menu" role="menu" aria-label="Project" hidden></div>
      </div>
    </aside>
  </main>

  <input type="file" id="file-input" multiple hidden>
  <script type="module" src="shell.js"></script>
</body>
</html>
