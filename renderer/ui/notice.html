<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Notice</title>
  <link rel="stylesheet" href="notice.css" />
</head>
<body>
  <!-- "Press Esc to exit full screen" over a page that took the whole screen
       or hid the pointer (main/access-notice.js). Set as text. -->
  <div id="bubble" role="status" hidden>
    <span id="n-title"></span>
    <span id="n-action">Press <kbd>Esc</kbd> to <span id="n-what"></span></span>
  </div>
  <script type="module" src="notice.js"></script>
</body>
</html>
