<!doctype html>
<!-- "Getting protected content ready…": shown by main/drm.js when Widevine
     takes a while to set up on a DRM build. No script: Open now links to
     #skip, and the browser catches Esc. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Getting protected content ready…</title>
  <link rel="stylesheet" href="drm-wait.css" />
</head>
<body>
  <main class="card" aria-labelledby="drm-title" aria-describedby="drm-desc">
    <span class="spinner" aria-hidden="true"></span>
    <div class="text" role="status" aria-live="polite">
      <h1 id="drm-title">Getting protected content ready…</h1>
      <p id="drm-desc">Lumio is setting up playback for sites like Netflix and Spotify. It only takes a moment the first time.</p>
    </div>
    <a class="btn" href="#skip" autofocus title="Protected videos may not play until it’s done (Esc)">Open now</a>
  </main>
</body>
</html>
