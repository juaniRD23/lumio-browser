<!doctype html>
<!-- A dark HUD over the page, in light mode too. -->
<html lang="en" data-appearance="dark">
<head>
  <meta charset="utf-8" />
  <title>Lumio</title>
  <link rel="stylesheet" href="aura.css" />
</head>
<body>
  <!-- ?mode=bar: the Stop bar over the page while Lumio works in the browser. -->
  <div id="pill" hidden>
    <span id="mark" class="mark"></span>
    <span class="text"><b id="title">Lumio is working</b><span id="step"></span></span>
    <button id="stop" type="button" title="Stop Lumio"><i class="sq"></i>Stop</button>
  </div>
  <script type="module" src="aura.js"></script>
</body>
</html>
