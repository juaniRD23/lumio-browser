<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Lumio Chat</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070708">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/chat.css">
</head>
<body class="app chat-app">
  <aside class="side" id="side" aria-label="Chats">
    <div class="side-top">
      <a class="brand" href="/" aria-label="Lumio home">
        <svg class="mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M35 12a21 21 0 1 0 17 19" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="48" cy="17" r="5" fill="#86b7ff"/></svg>
        <span>Lumio</span>
      </a>
      <button class="icon" id="close-side" aria-label="Close chats">✕</button>
    </div>
    <button class="btn new-chat" id="new-chat"><span aria-hidden="true">＋</span> New chat</button>
    <div class="list-label">Chats</div>
    <nav class="chat-list" id="chat-list" aria-label="Your chats"></nav>
    <a class="me" id="me" href="/account">
      <span class="avatar" id="me-avatar"></span>
      <span class="me-text"><b id="me-name"></b><small id="me-plan"></small></span>
    </a>
  </aside>

  <main class="main">
    <header class="main-head">
      <button class="icon" id="open-side" aria-label="Chats">☰</button>
      <h1 id="title">New chat</h1>
    </header>
    <div class="thread" id="thread" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Message Lumio" aria-label="Message Lumio"></textarea>
      <div class="composer-row">
        <div class="pick">
          <button type="button" class="chip" id="effort-btn" aria-haspopup="dialog" aria-expanded="false" title="Thinking effort">
            <span class="bars" id="effort-bars" data-level="2" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="effort-name">Medium</span>
          </button>
          <div class="pop effort-pop" id="effort-pop" role="dialog" aria-label="Thinking effort" hidden>
            <div class="effort-head"><b id="effort-label">Medium</b><span id="effort-desc"></span></div>
            <div class="slider" id="effort-slider" role="slider" tabindex="0" aria-label="Thinking effort" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1">
              <div class="s-track"><div class="s-fill"></div></div>
              <div class="s-knob"></div>
            </div>
            <div class="ticks"><button type="button" data-i="0">Low</button><button type="button" data-i="1">Medium</button><button type="button" data-i="2">High</button></div>
          </div>
        </div>
        <div class="pick">
          <button type="button" class="chip" id="model-btn" aria-haspopup="listbox" aria-expanded="false" title="Model">
            <span id="model-name">Lumio</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="pop model-pop" id="model-pop" role="listbox" aria-label="Model" hidden></div>
        </div>
        <span class="spacer"></span>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </main>

  <script type="module" src="/chat.js"></script>
</body>
</html>
