<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumio</title>
  <meta name="description" content="Lumio on your phone: your chats, and Lumio on your computer while you're away.">
  <meta name="theme-color" content="#070708">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumio">
  <link rel="manifest" href="/companion.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/companion-icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/companion.css">
</head>
<body>
  <main id="app" aria-live="polite"><div class="boot"><div class="mark"></div></div></main>
  <nav id="nav" class="nav" hidden>
    <button data-view="now" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Now</span></button>
    <button data-view="chats"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span>Chats</span></button>
    <button data-view="workflows"><svg viewBox="0 0 24 24"><path d="M4 6.5h9M4 12h6M4 17.5h9"/><path d="M15.5 9.5 21 13l-5.5 3.5z"/></svg><span>Workflows</span></button>
    <button data-view="tabs"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/></svg><span>Tabs</span></button>
  </nav>
  <div id="toast" class="toast" hidden></div>
  <script src="/sync-crypto.js"></script>
  <script type="module" src="/companion.js"></script>
</body>
</html>
