<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Lumio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070708">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="app">
  <header class="app-head">
    <a class="brand" href="/" aria-label="Lumio home">
      <svg class="mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M35 12a21 21 0 1 0 17 19" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="48" cy="17" r="5" fill="#86b7ff"/></svg>
      <span>Lumio</span>
    </a>
  </header>
  <main class="center">
    <div class="signin-card">
      <svg class="big-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M35 12a21 21 0 1 0 17 19" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="48" cy="17" r="5" fill="#86b7ff"/></svg>
      <h1>Sign in to Lumio</h1>
      <p>One account for Lumio Chat and Lumio Browser. Free to start.</p>
      <div class="notice err" id="error" hidden></div>
      <a class="btn primary google-btn" id="google" href="/api/auth/google/start">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <p class="fine">By continuing, you agree to Lumio’s <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
    </div>
  </main>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const next = q.get('next');
      if (next && /^\/(?!\/)/.test(next)) document.getElementById('google').href = '/api/auth/google/start?next=' + encodeURIComponent(next);
      const messages = {
        expired: 'That sign-in took too long. Try again.',
        cancelled: 'Sign-in was cancelled.',
        google: 'Google couldn’t confirm your account. Try again.',
        unavailable: 'Sign-in isn’t available right now. Try again soon.',
      };
      const e = q.get('error');
      if (e) { const el = document.getElementById('error'); el.hidden = false; el.textContent = messages[e] || 'Sign-in didn’t work. Try again.'; }
      // Already signed in? Go straight on.
      fetch('/api/account').then((r) => r.json()).then((a) => { if (a.signedIn && !e) location.replace(next && /^\/(?!\/)/.test(next) ? next : '/account'); }).catch(() => {});
    })();
  </script>
</body>
</html>
