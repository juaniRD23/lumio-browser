# Publish a Lumio Beta build to try before releasing:
#   Actions → "Lumio Beta" → Run workflow (pick the branch, say what to try).
# A Mac runner builds "Lumio Beta.app" (its own app, profile and icon) for
# Apple Silicon and Intel, signs and notarizes it like a release, and puts it
# on a GitHub pre-release (vX.Y.Z-beta.N). Installed copies of Lumio Beta
# offer it within the hour; Lumio Browser and the website never see betas.
# With the castlabs EVS secrets it's a DRM (Widevine) build, like a release
# (docs/drm.md).
name: Lumio Beta

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to try: separate items with  |  (for example: Faster spreadsheets | Esc fix)"
        required: true

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY != '' }}
      HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' && secrets.EVS_PASSWORD != '' && !contains(fromJSON('["0","false","no"]'), vars.LUMIO_DRM) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Electron 43 fetches its app on first run, not at install; the credits
      # tests read Chromium's notices from it.
      - name: Fetch Electron
        run: node node_modules/electron/install.js

      - name: Test
        run: npm test

      - name: Choose the beta version
        id: version
        run: node scripts/beta.mjs --prepare

      - name: Load the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/lumio-signing.keychain-db"
          kcpw="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$id" ]; then echo "::error::No Developer ID Application certificate in MACOS_CERT_P12"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Load the notarization key
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # DRM builds: sign in to castlabs EVS; build/package.mjs then swaps in
      # castlabs' Electron and VMP-signs the app (docs/drm.md).
      - uses: actions/setup-python@v5
        if: env.HAS_EVS == 'true'
        with:
          python-version: '3.12'

      # Installed in a step of its own, so the install never sees the password.
      - name: DRM (castlabs EVS client)
        if: env.HAS_EVS == 'true'
        run: python -m pip install --upgrade castlabs-evs

      - name: DRM (castlabs EVS sign-in)
        if: env.HAS_EVS == 'true'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWORD }}
        run: |
          python -m castlabs_evs.account --no-ask reauth
          echo "LUMIO_DRM=1" >> "$GITHUB_ENV"
          echo "EVS_PYTHON=python" >> "$GITHUB_ENV"

      - name: Build Lumio Beta (Mac Apple Silicon, Mac Intel)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/build-preload.mjs
          node build/package.mjs --release --mac --beta

      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: node scripts/beta.mjs --publish

      - name: Forget the signing keys
        if: always()
        run: |
          [ -n "$MACOS_SIGN_KEYCHAIN" ] && security delete-keychain "$MACOS_SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          [ "$HAS_EVS" = true ] && python -m castlabs_evs.account --no-ask deauth || true

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### Lumio Beta $VERSION is out" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
