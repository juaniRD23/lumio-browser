# Run Lumio Browser's unit tests and end-to-end suite on a GitHub Windows
# machine: Actions → "E2E tests (Windows)" → Run workflow.
# Same as the Mac workflow (e2e.yml), without the Mac-only steps (the Swift
# helper, the keychain, screen captures). Some tests are about Mac-only
# features (Touch ID, the Mac helper) and are expected to fail or skip here.
name: E2E tests (Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (leave empty for the branch you run this from)"
        required: false
        default: ""
      skip:
        description: "Skip tests whose name matches this regex (node --test-skip-pattern). Leave empty to run everything."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      LUMIO_ACCOUNT_BASE: http://127.0.0.1:9
      LUMIO_AI_BASE: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the shell preload and copy the panel's web files
        run: node scripts/build-preload.mjs

      - name: Machine info
        run: |
          node --version
          ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron -p "'Electron ' + process.versions.electron + ' on ' + process.platform + ' ' + process.arch"
          powershell -NoProfile -Command "(Get-CimInstance Win32_OperatingSystem).Caption"

      - name: Unit tests
        run: |
          mkdir -p "$ARTIFACTS"
          npm test 2>&1 | tee "$ARTIFACTS/unit.log"

      - name: Run the e2e suite
        if: always()
        timeout-minutes: 35
        env:
          LUMIO_SHOTS: ${{ github.workspace }}/e2e-artifacts/shots
          E2E_SKIP: ${{ inputs.skip }}
        run: |
          mkdir -p "$ARTIFACTS/shots"
          set -- --test --test-concurrency=1 --test-timeout=180000 --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$ARTIFACTS/junit.xml"
          if [ -n "$E2E_SKIP" ]; then set -- "$@" "--test-skip-pattern=$E2E_SKIP"; fi
          node "$@" tests/e2e/*.e2e.mjs 2>&1 | tee "$ARTIFACTS/e2e.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Lumio on Windows"
            echo '```'
            echo "Unit:"; grep -E '^ℹ (tests|pass|fail)' "$ARTIFACTS/unit.log" || true
            echo "E2E:"; grep -E '^ℹ (tests|pass|fail)' "$ARTIFACTS/e2e.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumio-e2e-windows
          path: e2e-artifacts
          retention-days: 7

  # The real setup program: build it, install it the way people do (silently
  # here), check it registered properly, open the installed Lumio, uninstall.
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }

      - name: Build the Windows packages
        env:
          # A stand-in Store identity: checks the MSIX builds (the real one comes from Partner Center).
          STORE_IDENTITY_NAME: LumioTest.LumioBrowser
          STORE_PUBLISHER: CN=Lumio Test
          STORE_PUBLISHER_NAME: Lumio Test
        run: |
          node scripts/build-preload.mjs
          node build/package.mjs --release --windows
          ls -la dist/release

      - name: Install, check, open, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Start-Process 'dist\release\Lumio-Browser-Setup-windows-x64.exe' -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Lumio Browser'
          foreach ($f in @('Lumio Browser.exe', 'Uninstall Lumio Browser.exe', 'resources\app.asar', 'resources\lumio-helper.ps1')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Lumio Browser.lnk'
          if (-not (Test-Path $lnk)) { throw 'No Start menu shortcut' }
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LumioBrowser'
          if ($u.DisplayVersion -ne $version) { throw "Apps & features shows $($u.DisplayVersion), not $version" }
          $r = Get-ItemProperty 'HKCU:\Software\RegisteredApplications'
          if (-not $r.'Lumio Browser') { throw 'Not registered as a browser' }
          $assoc = Get-ItemProperty 'HKCU:\Software\Clients\StartMenuInternet\LumioBrowser\Capabilities\URLAssociations'
          if ($assoc.https -ne 'LumioHTML') { throw 'https is not associated' }
          Write-Host "Installed $version in $dir, registered as a browser."

          # Open it, as a person would, and make sure it stays up.
          $p = Start-Process (Join-Path $dir 'Lumio Browser.exe') -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Lumio Browser quit right away (exit code $($p.ExitCode))" }
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save('shots\installed-lumio.png')
          $shortcutTarget = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "Start menu shortcut opens: $shortcutTarget"
          Stop-Process -Name 'Lumio Browser' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # Uninstall (the uninstaller copies itself to Temp and runs from there).
          Start-Process (Join-Path $dir 'Uninstall Lumio Browser.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'Lumio Browser.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'Lumio Browser.exe')) { throw 'Still installed after uninstalling' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LumioBrowser') { throw 'Apps & features entry left behind' }
          if (Test-Path $lnk) { throw 'Start menu shortcut left behind' }
          Write-Host 'Uninstalled cleanly.'

      - name: Save the packages and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumio-windows-packages
          path: |
            dist/release/*.exe
            dist/release/*.msix
            shots/
          retention-days: 7
