<!doctype html>
<meta charset="utf-8">
<title>Test Signup</title>
<h1>Create account</h1>
<form id="f" action="/welcome" method="post">
  <input id="user" name="user" type="email" autocomplete="username" placeholder="Email">
  <input id="pass" name="pass" type="password" autocomplete="new-password" placeholder="New password">
  <input id="pass2" name="pass2" type="password" autocomplete="new-password" placeholder="Confirm password">
  <button id="go" type="submit">Create account</button>
</form>
