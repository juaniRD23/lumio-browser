<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your account</title>
  <style>body { margin: 0; padding: 8px; font: 14px sans-serif; }</style>
</head>
<body>
  <p>Account of jane@example.com, balance $12,345</p>
  <button id="transfer">Transfer</button>
  <script>
    window.events = [];
    document.addEventListener('click', (e) => window.events.push(`click:${e.target.id}:${e.isTrusted}`), true);
  </script>
</body>
</html>
